{% extends 'accounts/base.html' %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded shadow">
    <h2 class="text-2xl font-bold mb-6">Sign In</h2>
    <form method="post">
        {% csrf_token %}
        <div class="mb-4">
            <label class="block text-gray-700 mb-2" for="id_username">Email</label>
            {{ form.username }}
        </div>
        <div class="mb-6">
            <label class="block text-gray-700 mb-2" for="id_password">Password</label>
            {{ form.password }}
        </div>
        <button type="submit" class="w-full bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600">
            Sign In
        </button>
    </form>
    <p class="mt-4 text-center">
        Don't have an account? <a href="{% url 'signup' %}" class="text-blue-500">Sign Up</a>
    </p>
</div>
{% endblock %}
